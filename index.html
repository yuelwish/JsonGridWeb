<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Grid - 高性能 JSON 格式化工具</title>
  <!-- 内联图标：data URI 而非外链，保持产物为单个 HTML（核心约束） -->

</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <h1><img class="logo-mark" alt="" aria-hidden="true" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAkCAYAAADhAJiYAAAABmJLR0QA/wD/AP+gvaeTAAADOklEQVRYhdWYPUyTQRjH/3ctCNjSFqxgi3FQBo04oaBxABQTEjfTBHEwsJhIIgOLmyQMOjAYCTFhQJGIxM3EBCMCm1GJg6I4oINIDR9CC8UWaPs+5o7w0tL2fUmFFv5Ln7t7cvd777mvPgybVHatpRxE9QCqAOYEKBvbKhYAMAnQMFOUrnd9re+jWteNCleLKZCJThBdRcpEROC9y4alG5972v6qQBImg4YBlCINYmAjfsNSpYDiokLOTJpghAh0OjtseihstrZmlLcAU8OXHhFx8HIOBQ3phxFijED1HAwV2CUioMoIoEjPMcNogN1mjqpTFML0/AKIon3FXGeZLWBcLk9Vy75FKOGw3lBFRr1zpub8KTRfr0FWZkZM2/TcAm7ff47xiWlZzi08hNIrtcjOtcT4hkNBjPa/hPvLJ63hcqI/I87MNCeAESrIt6Cx9qJaPl5VHRdGyGDMQEnNZXCDQWtIaALlW80JYdblPGhT7f3WPE1fAbXPZE4eCGKZpVg6QKnX3gJSFNrS9ajaiqLvr+OjCfTH45NbW0uj45Oq7XFv2PEUWFzAytKipo84GBNKIZLnjNjajojdJNsUBV+/u9H+bECtGxt8JX+tDmfMwej3evBt6HXMQbpZrKzuTuq30l5a1EY9h+IjhWisvQCHPTZkYz/ceNA7AK/PL+us5hzcqqvGiaNO8E0h+z3rQUffIMZ/TiUPxBnDvSaXvCLiqaggT66J1s4XsixgLp0rievrsFtxt8kFV3O75jrSDNkBmzkhzLpKijceCyePaT8cCvMtsNtyNX00gTjXf7exiLddpJ1sn7tuUXPsLSC2A0P+R8jmvD4srwY1O3DPeOLa8RRYWZV9Jg0UDIXR9rg/IdTU3AI6+t6oZWGLukQwbd39sk+9q0P8hc3Zzkd+QZ4lZjfNzPsQ0n/k+40AcwNUrOUVDIXxe9aLrUgAJpolfbFfXGQhsEtEwBAXKZG170q3iIiFH3GRnxEpkXTjMOJPRp62jshdJvIzIiWSRp4PQTNuCkMCibyMyM8ArCe14SNixLpDJlb5sbNFvmFijs2zdS1nFIYGEAnAwzuU0ptgoOEwU7pEmCJb/wEZ5zlk3JEIKQAAAABJRU5ErkJggg=="><span class="logo-json">JSON</span><span class="logo-grid">GRID</span></h1>
      </div>
      <div class="toolbar-right">
        <button id="btn-layout" class="round-btn" title="切换 JSON 区域全屏 / 回到分屏" aria-label="切换 JSON 区域全屏或分屏"><svg viewBox="0 0 512 512" class="round-icon round-icon-fill" id="layout-icon"><path d="M0 96C0 60.7 28.7 32 64 32H448c35.3 0 64 28.7 64 64V416c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V96zm64 64V416H224V160H64zm384 0H288V416H448V160z"/></svg></button>
        <button id="btn-compact" class="round-btn" title="紧凑格式化：关" aria-label="紧凑格式化" aria-pressed="false"><svg viewBox="0 0 24 24" class="round-icon round-icon-fill"><rect x="3" y="5" width="18" height="2.6" rx="1.3"/><rect x="3" y="10.7" width="12" height="2.6" rx="1.3"/><rect x="7" y="16.4" width="14" height="2.6" rx="1.3"/></svg></button>
        <button id="btn-theme" class="round-btn" title="切换主题" aria-label="切换主题"><svg viewBox="0 0 24 24" class="round-icon round-icon-fill" id="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      </div>
    </header>

    <main class="editor-stage">
      <!-- 左面板：JSON 编辑器 -->
      <section id="panel-json" class="panel-json">
        <div class="panel-strip">
          <span class="panel-strip-title">JSON</span>
          <div class="panel-strip-actions">
            <button id="btn-sample" class="strip-btn" title="加载示例数据" data-color="gray" title="加载示例数据"><svg viewBox="0 0 24 24" class="bi"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>
            <button id="btn-search" class="strip-btn" title="搜索" data-color="blue" title="搜索"><svg viewBox="0 0 24 24" class="bi"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
            <button id="btn-format" class="strip-btn" title="格式化" data-color="purple" title="格式化"><svg viewBox="0 0 24 24" class="bi"><line x1="21" y1="6" x2="3" y2="6"/><line x1="15" y1="12" x2="3" y2="12"/><line x1="17" y1="18" x2="3" y2="18"/></svg></button>
            <button id="btn-minify" class="strip-btn" title="压缩" data-color="lightblue" title="压缩"><svg viewBox="0 0 24 24" class="bi"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
            <button id="btn-validate" class="strip-btn" title="校验" data-color="green" title="校验"><svg viewBox="0 0 24 24" class="bi"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></button>
            <button id="btn-clear" class="strip-btn" title="清空" data-color="yellow" title="清空"><svg viewBox="0 0 24 24" class="bi"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
          </div>
        </div>
        <div id="editor-container" class="editor-container"></div>
      </section>

      <!-- 分隔条：深灰竖条，▶ 渲染按钮居中 + 底部 ‹ › 全屏切换（原站 separator 结构） -->
      <div id="split-handle" class="separator">
        <div id="sep-label" class="separator-label" hidden>JSON</div>
        <button id="btn-render-grid" class="separator-button" title="把左侧 JSON 渲染到右侧 GRID"><span class="sep-icon">▶</span></button>
        <div class="separator-bottom">
          <button class="separator-button sep-small" data-side="left" title="GRID 全屏"><span class="sep-icon">‹</span></button>
          <button class="separator-button sep-small" data-side="right" title="JSON 全屏"><span class="sep-icon">›</span></button>
        </div>
      </div>

      <!-- 右面板：GRID -->
      <section id="panel-grid" class="panel-grid">
        <div class="panel-strip">
          <span class="panel-strip-title">GRID</span>
          <div class="panel-strip-actions">
            <button id="grid-btn-search" class="strip-btn" title="搜索" data-color="blue"><svg viewBox="0 0 24 24" class="bi"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
            <button id="grid-btn-expand-all" class="strip-btn" title="展开全部" data-color="lightblue"><svg viewBox="0 0 24 24" class="bi"><path fill="currentColor" stroke="none" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 9h4v2h-4v4h-2v-4H7v-2h4V7h2v4Z"/></svg></button>
            <button id="grid-btn-collapse-all" class="strip-btn" title="折叠全部" data-color="lightblue"><svg viewBox="0 0 24 24" class="bi"><path fill="currentColor" stroke="none" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm5 11H7v-2h10v2Z"/></svg></button>
            <button id="grid-btn-export-csv" class="strip-btn" title="导出 CSV" data-color="purple"><svg viewBox="0 0 24 24" class="bi"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
          </div>
        </div>
        <div id="grid-stage" class="grid-stage">
          <div id="grid-view" class="grid-container"></div>
        </div>
        <!-- 树形视图（当前版本隐藏；GRID 为唯一数据视图） -->
        <div id="tree-view" class="tree-container" style="display: none;"></div>
      </section>
    </main>

    <footer class="status-bar">
      <span id="left-stats">输入: 0 字符 | 0 行</span>
      <span id="status-message">就绪</span>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
