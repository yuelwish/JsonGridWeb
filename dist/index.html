</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <h1>JSON Grid</h1>
      </div>
      <div class="toolbar-right">
        <input id="search-input" type="text" placeholder="搜索..." class="search-input">
        <button id="btn-theme" class="theme-toggle" title="切换主题">🌙</button>
      </div>
    </header>
    
    <main class="content">
      <div class="panel left-panel">
        <div class="panel-header">
          <span class="panel-title">输入 JSON</span>
          <div class="panel-actions">
            <button id="btn-format" class="action-btn">格式化</button>
            <button id="btn-compress" class="action-btn">压缩</button>
            <button id="btn-clear" class="action-btn">清空</button>
            <button id="btn-fullscreen-left" class="action-btn" title="全屏/恢复">⛶</button>
          </div>
        </div>
        <div id="editor-input" class="editor-container"></div>
      </div>
      
      <div id="resizer" class="panel-resizer" title="拖拽调整面板宽度">
        <button id="btn-collapse-left" class="resizer-btn" title="折叠左侧面板">‹</button>
        <button id="btn-collapse-right" class="resizer-btn" title="折叠右侧面板">›</button>
      </div>
      
      <div class="panel right-panel">
        <div class="panel-header">
          <div class="view-tabs">
            <button class="tab-btn active" data-view="grid">Grid</button>
            <button class="tab-btn" data-view="tree">树形</button>
          </div>
          <button id="btn-fullscreen-right" class="action-btn" title="全屏/恢复">⛶</button>
        </div>
        <div id="editor-output" class="editor-container" style="display: none;"></div>
        <div id="grid-toolbar" class="grid-toolbar" style="display: none;">
          <div class="grid-toolbar-group">
            <button id="grid-btn-expand-all" class="grid-toolbar-btn" title="展开全部嵌套">展开全部</button>
            <button id="grid-btn-collapse-all" class="grid-toolbar-btn" title="折叠全部嵌套">折叠全部</button>
          </div>
          <div class="grid-toolbar-group">
            <input id="grid-filter-input" type="text" class="grid-filter-input" placeholder="过滤..." title="输入关键词过滤行">
          </div>
          <div class="grid-toolbar-group">
            <button id="grid-btn-export-csv" class="grid-toolbar-btn" title="导出当前数据为 CSV">导出 CSV</button>
          </div>
        </div>
        <div id="grid-view" class="grid-container"></div>
        <div id="tree-view" class="tree-container" style="display: none;"></div>
      </div>
    </main>
    
    <footer class="status-bar">
      <span id="left-stats">输入: 0 字符 | 0 行</span>
      <span id="status-message">就绪</span>
      <span id="right-stats">输出: 0 字符 | 0 行</span>
    </footer>
  </div>
  
</body>
</html>
